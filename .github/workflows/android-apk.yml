name: Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  cleanup:
    name: 清理过时 APK 产物
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const obsoleteNames = new Set([
              'PairLink-0.1.0-debug',
              'PairLink-0.2.0-debug',
              'PairLink-release-unsigned',
            ]);
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo,
              per_page: 100,
            });
            const obsolete = artifacts.filter(artifact => obsoleteNames.has(artifact.name));
            for (const artifact of obsolete) {
              await github.rest.actions.deleteArtifact({
                ...context.repo,
                artifact_id: artifact.id,
              });
              core.info('已删除 ' + artifact.name + ' (' + artifact.id + ')');
            }
            await core.summary.addHeading('旧 APK 产物清理')
              .addRaw('已删除 ' + obsolete.length + ' 个过时的 APK 产物')
              .write();
  android:
    needs: cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - run: |
          mkdir -p /tmp/pairlink-shell-tests
          javac -d /tmp/pairlink-shell-tests android/app/src/main/java/com/lijinmu/pairlink/ShellRunner.java android/test/ShellRunnerTest.java
          java -cp /tmp/pairlink-shell-tests com.lijinmu.pairlink.ShellRunnerTest
          javac -d /tmp/pairlink-shell-tests android/app/src/main/java/com/lijinmu/pairlink/SummaryWindow.java android/test/SummaryWindowTest.java
          java -cp /tmp/pairlink-shell-tests com.lijinmu.pairlink.SummaryWindowTest
          javac -d /tmp/pairlink-shell-tests android/app/src/main/java/com/lijinmu/pairlink/ShellPolicy.java android/test/ShellPolicyTest.java
          java -cp /tmp/pairlink-shell-tests com.lijinmu.pairlink.ShellPolicyTest
          javac -d /tmp/pairlink-shell-tests android/app/src/main/java/com/lijinmu/pairlink/ScreenshotPolicy.java android/app/src/main/java/com/lijinmu/pairlink/BinaryCommand.java android/test/ScreenshotPolicyTest.java android/test/BinaryCommandTest.java
          java -cp /tmp/pairlink-shell-tests com.lijinmu.pairlink.ScreenshotPolicyTest
          java -cp /tmp/pairlink-shell-tests com.lijinmu.pairlink.BinaryCommandTest
      - run: gradle --no-daemon -p android assembleRelease lintRelease
      - name: 验证并准备未签名 Release APK
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK" > /tmp/pairlink-signature-check.txt 2>&1; then
            echo "::error::生成的 APK 意外包含签名"
            exit 1
          fi
          cat /tmp/pairlink-signature-check.txt
          python3 - <<'PY'
          from pathlib import Path
          result = Path('/tmp/pairlink-signature-check.txt').read_text()
          assert 'DOES NOT VERIFY' in result and 'Missing META-INF/MANIFEST.MF' in result, result
          PY
          cp "$APK" PairLink-0.2.1-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PairLink-0.2.1-release-unsigned
          path: PairLink-0.2.1-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
