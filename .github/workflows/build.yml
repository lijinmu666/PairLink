name: 编译与验证
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          mkdir -p /tmp/pairlink-shell-tests
          javac -d /tmp/pairlink-shell-tests android/app/src/main/java/com/lijinmu/pairlink/ShellRunner.java android/test/ShellRunnerTest.java
          java -cp /tmp/pairlink-shell-tests com.lijinmu.pairlink.ShellRunnerTest
      - run: gradle --no-daemon -p android assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PairLink-0.1.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci && npm test && npm run check
        working-directory: worker
