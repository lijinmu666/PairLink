name: 编译与验证
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - run: |
          mkdir -p /tmp/pairlink-shell-tests
          javac -d /tmp/pairlink-shell-tests android/app/src/main/java/com/lijinmu/pairlink/ShellRunner.java android/test/ShellRunnerTest.java
          java -cp /tmp/pairlink-shell-tests com.lijinmu.pairlink.ShellRunnerTest
      - run: gradle --no-daemon -p android assembleRelease lintRelease
      - run: |
          mkdir -p /tmp/pairlink-release
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f -v 4 android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/pairlink-release/PairLink-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" /tmp/pairlink-release/
      - uses: actions/upload-artifact@v4
        with:
          name: PairLink-release-unsigned
          path: /tmp/pairlink-release/

  railway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: railway/package-lock.json
      - run: npm ci && npm test && npm run check
        working-directory: railway
